name: Release IPA (with build proof)

# How to run: GitHub -> Actions tab -> "Release IPA (with build proof)" -> Run workflow
# Type a version such as v1.0.0 and press the green button.
# It builds the app on GitHub, writes a checksum, signs a build attestation (proof of where the
# file came from) and publishes everything on the Releases page.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build proof
      attestations: write   # store the build proof
    steps:
      - name: Check the version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.0.0"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project PulseLite.xcodeproj -scheme PulseLite

      - name: Build the unsigned IPA
        run: |
          xcodebuild build \
            -project PulseLite.xcodeproj \
            -scheme PulseLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/PulseLite.app Payload/
          zip -r -y PulseLite-Glass-Broadcaster.ipa Payload

      - name: Write the checksum
        run: shasum -a 256 PulseLite-Glass-Broadcaster.ipa > SHA256SUMS.txt

      - name: Create the signed build proof (attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: PulseLite-Glass-Broadcaster.ipa

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > notes.md <<'EOF'
          This is an unsigned IPA. Sign it with your own Apple ID using a sideloading tool on your computer.

          Check your download (optional):
          - Checksum: compare the SHA-256 of the file with SHA256SUMS.txt
          - Build proof: gh attestation verify PulseLite-Glass-Broadcaster.ipa --repo zeanvelas-cell/model-1

          Full steps: https://github.com/zeanvelas-cell/model-1#check-your-download-optional
          EOF
          gh release create "$VERSION" \
            PulseLite-Glass-Broadcaster.ipa \
            SHA256SUMS.txt \
            --title "PulseLite $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --target "$GITHUB_SHA"
